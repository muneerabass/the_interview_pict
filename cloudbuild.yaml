# Build the image and push it to Artifact Registry:
#   gcloud builds submit --config cloudbuild.yaml --project=interview-room-prod
# then roll it out on the VM (pulls :latest and restarts the app container):
#   gcloud compute ssh interview-room-vm --zone=asia-south1-a --project=interview-room-prod -- sudo /opt/app/deploy.sh
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: [DOCKER_BUILDKIT=1]
    secretEnv: [MONGODB_URI]
    args:
      - -c
      - |
        printf '%s' "$$MONGODB_URI" > /tmp/mongodb_uri
        docker build --secret id=mongodb_uri,src=/tmp/mongodb_uri \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/interview-room:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/interview-room:latest .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/interview-room:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/interview-room:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/mongodb-uri/versions/latest
      env: MONGODB_URI

substitutions:
  _REGION: asia-south1

options:
  logging: CLOUD_LOGGING_ONLY
